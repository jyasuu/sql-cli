[package]
name = "sql-cli"
version = "0.2.0"
edition = "2021"
description = "SQL parser CLI powered by datafusion-sqlparser-rs"

[dependencies]
sqlparser  = { version = "0.46",    features = ["serde"] }
clap       = { version = "=4.4.18", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.25"
similar    = "2"
rustyline  = "=11.0.0"
colored    = "2"
indexmap   = "=2.2.6"