[package]
name = "sql-cli"
version = "0.1.0"
edition = "2021"
description = "A minimal CLI tool for parsing and inspecting SQL using datafusion-sqlparser-rs"

[dependencies]
sqlparser = { version = "0.46", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
serde_json = "1"
